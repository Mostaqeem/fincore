<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f4; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background-color: #4f46e5;
                  padding: 32px 40px;
                  text-align: center;
                "
              >
                <h1 style="color: #ffffff; margin: 0; font-size: 24px">
                  Reset Password
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px">
                <p style="font-size: 16px; color: #333333; margin: 0 0 16px">
                  Hi <strong>{{ first_name }}</strong>,
                </p>
                <p
                  style="
                    font-size: 14px;
                    color: #555555;
                    line-height: 1.6;
                    margin: 0 0 24px;
                  "
                >
                  We received a request to reset your password. Use the code
                  below to proceed.
                </p>
                <div style="text-align: center; margin: 32px 0">
                  <span
                    style="
                      display: inline-block;
                      background-color: #f3f4f6;
                      padding: 16px 40px;
                      border-radius: 6px;
                      font-size: 36px;
                      font-weight: bold;
                      letter-spacing: 12px;
                      color: #4f46e5;
                    "
                  >
                    {{ otp }}
                  </span>
                </div>
                <p
                  style="
                    font-size: 14px;
                    color: #555555;
                    line-height: 1.6;
                    margin: 0 0 24px;
                  "
                >
                  This code expires in <strong>10 minutes</strong>. If you
                  didn't request a password reset, you can safely ignore this email.
                </p>
                <hr
                  style="
                    border: none;
                    border-top: 1px solid #e5e7eb;
                    margin: 24px 0;
                  "
                />
                <p style="font-size: 12px; color: #999999; margin: 0">
                  &copy; 2026 Mostaqeem's Company. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
